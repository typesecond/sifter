[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sifter-vanity"
version = "0.2.0"
description = "Local Ethereum vanity address search with CPU and OpenCL engines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["eth-account==0.14.0", "customtkinter==5.2.2"]

[project.scripts]
sifter = "sifter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
sifter = ["assets/*", "engines/LICENSE", "engines/macos-arm64/*.cl", "engines/macos-arm64/profanity2-macos-arm64", "engines/macos-x86_64/*.cl", "engines/macos-x86_64/profanity2-macos-x86_64"]

[tool.setuptools.exclude-package-data]
sifter = ["engines/**/cache*"]
